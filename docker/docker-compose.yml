version: '3.8'

services:
  # Dashboard Central de Gestión
  hermes-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: hermes-dashboard
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config:rw
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://apanel:apanel_password@postgres:5432/apanel_db
      - REDIS_URL=redis://redis:6379/0
      - DASHBOARD_SECRET_KEY=your-secret-key-change-me
    depends_on:
      - postgres
      - redis
    networks:
      - hermes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database para persistencia
  postgres:
    image: postgres:15-alpine
    container_name: hermes-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=apanel_db
      - POSTGRES_USER=apanel
      - POSTGRES_PASSWORD=apanel_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    networks:
      - hermes-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apanel -d apanel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para caché y colas
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hermes-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (opcional, para producción)
  nginx:
    image: nginx:alpine
    container_name: hermes-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - hermes-dashboard
    networks:
      - hermes-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  hermes-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
