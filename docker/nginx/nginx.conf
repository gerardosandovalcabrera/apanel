events {
    worker_connections 1024;
}

http {
    upstream hermes_dashboard {
        server hermes-dashboard:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Redirigir HTTP a HTTPS en producción
        # return 301 https://$server_name$request_uri;

        location / {
            proxy_pass http://hermes_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts largos para health checks
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://hermes_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Configuración HTTPS para producción (descomentar y configurar certificados)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    # 
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
